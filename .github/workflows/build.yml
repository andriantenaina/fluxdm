name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0-dev' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Frontend
        working-directory: frontend
        run: npm ci && npm run check && npm run build
      - name: Go tests (engine, media, extractors...)
        run: |
          go vet ./internal/... ./cmd/fluxdm-host ./cmd/fluxdm-cli
          go test -race ./internal/... -count=1

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Windows resources (icon + manifest)
        shell: pwsh
        run: |
          $v = "${{ env.VERSION }}".TrimStart('v') -replace '-.*',''
          go run ./tools/genicons build/appicon 16 32 48 128 256 512 1024
          go run ./tools/genicons build/appicon ico
          go install github.com/tc-hib/go-winres@v0.3.3
          Push-Location cmd/fluxdm
          go-winres simply --icon ../../build/appicon/icon-256.png --manifest gui --product-name FluxDM --file-description "FluxDM" --product-version "$v.0" --file-version "$v.0" --original-filename fluxdm.exe
          Pop-Location
      - name: Build
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-H windowsgui -s -w -X main.Version=${{ env.VERSION }}" -o build/bin/fluxdm.exe ./cmd/fluxdm
          go build -trimpath -ldflags "-s -w" -o build/bin/fluxdm-host.exe ./cmd/fluxdm-host
          go build -trimpath -ldflags "-s -w" -o build/bin/fluxdm-cli.exe ./cmd/fluxdm-cli
      - name: Installer (NSIS)
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress; $env:PATH += ";C:\Program Files (x86)\NSIS" }
          makensis /DVERSION=${{ env.VERSION }} build/windows/installer.nsi
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/bin/FluxDM-Setup-*.exe dist/
          Compress-Archive -Path build/bin/fluxdm.exe, build/bin/fluxdm-host.exe, build/bin/fluxdm-cli.exe -DestinationPath dist/FluxDM-windows-portable.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/* }

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build universal binaries (macOS 12+)
        run: |
          set -e
          export MACOSX_DEPLOYMENT_TARGET=12.0
          export CGO_ENABLED=1
          LD="-s -w -X main.Version=${VERSION}"
          CC="clang -arch arm64" CGO_CFLAGS="-mmacosx-version-min=12.0" CGO_LDFLAGS="-mmacosx-version-min=12.0" GOARCH=arm64 \
            go build -trimpath -ldflags "$LD" -o out/fluxdm-arm64 ./cmd/fluxdm
          CC="clang -arch x86_64" CGO_CFLAGS="-mmacosx-version-min=12.0" CGO_LDFLAGS="-mmacosx-version-min=12.0" GOARCH=amd64 \
            go build -trimpath -ldflags "$LD" -o out/fluxdm-amd64 ./cmd/fluxdm
          lipo -create -output out/fluxdm out/fluxdm-arm64 out/fluxdm-amd64
          CGO_ENABLED=0 GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o out/host-arm64 ./cmd/fluxdm-host
          CGO_ENABLED=0 GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o out/host-amd64 ./cmd/fluxdm-host
          lipo -create -output out/fluxdm-host out/host-arm64 out/host-amd64
          lipo -info out/fluxdm
      - name: App bundle + DMG
        run: |
          set -e
          go run ./tools/genicons build/appicon 16 32 64 128 256 512 1024
          APP=out/FluxDM.app
          mkdir -p $APP/Contents/MacOS $APP/Contents/Resources
          cp out/fluxdm out/fluxdm-host $APP/Contents/MacOS/
          sed "s/__VERSION__/${VERSION#v}/g" build/darwin/Info.plist > $APP/Contents/Info.plist
          ICONSET=out/icon.iconset; mkdir -p $ICONSET
          for s in 16 32 128 256 512; do
            sips -z $s $s build/appicon/icon-1024.png --out $ICONSET/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); sips -z $d $d build/appicon/icon-1024.png --out $ICONSET/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns $ICONSET -o $APP/Contents/Resources/icon.icns
          mkdir -p $APP/Contents/Resources/extension
          rsync -a --exclude keys extension/ $APP/Contents/Resources/extension/
          # ad-hoc signature (required on Apple Silicon); notarization needs an Apple Developer account
          codesign --force --deep --sign - $APP
          mkdir -p dist
          hdiutil create -volname FluxDM -srcfolder $APP -ov -format UDZO dist/FluxDM-macOS-${VERSION}.dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/* }

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Package extension (Opera / Chrome / Edge / Brave)
        run: |
          go run ./tools/genicons extension/icons 16 32 48 128
          mkdir -p dist
          cd extension && zip -r ../dist/FluxDM-extension-${VERSION}.zip . -x 'keys/*'
      - uses: actions/upload-artifact@v4
        with: { name: extension, path: dist/* }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows, macos, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
